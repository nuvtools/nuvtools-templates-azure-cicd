name: CI (Docker)

# Build, test and push a container image. Tag-driven version/environment
# resolution has been removed: the caller chooses the environment explicitly
# and passes app-version (used as the image tag) in.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version (e.g., 10.0.x).'
        type: string
        required: false
        default: '10.0.x'
      project-path:
        description: 'Path to the solution or project file.'
        type: string
        required: true
      test-path:
        description: 'Path to the test project. Leave empty to skip tests.'
        type: string
        required: false
        default: ''
      configuration:
        description: 'Build configuration.'
        type: string
        required: false
        default: 'Release'
      acr-registry:
        description: 'ACR registry name (e.g., myregistry.azurecr.io).'
        type: string
        required: true
      image-name:
        description: 'Docker image name (without registry or tag).'
        type: string
        required: true
      image-tag:
        description: 'Image tag. Defaults to the run number.'
        type: string
        required: false
        default: ''
      dockerfile:
        description: 'Path to Dockerfile. Leave empty for default .NET Dockerfile.'
        type: string
        required: false
        default: ''
      entry-point-dll:
        description: 'Entry point DLL for default Dockerfile.'
        type: string
        required: false
        default: ''
      publish-artifacts:
        description: 'Whether to publish build artifacts (consumed by the default Dockerfile build).'
        type: boolean
        required: false
        default: true
      push:
        description: 'Whether to push the image to the registry.'
        type: boolean
        required: false
        default: true
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: false
    outputs:
      version:
        description: 'Resolved image tag.'
        value: ${{ jobs.build-test.outputs.version }}
      image-uri:
        description: 'Full Docker image URI.'
        value: ${{ jobs.docker.outputs.image-uri }}

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve image tag
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.image-tag }}"
          [ -z "$VERSION" ] && VERSION="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Image tag: $VERSION"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        uses: nuvtools/nuvtools-templates-azure-cicd/.github/actions/dotnet-build-test@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-path: ${{ inputs.project-path }}
          test-path: ${{ inputs.test-path }}
          configuration: ${{ inputs.configuration }}
          publish-artifacts: ${{ inputs.publish-artifacts }}
          artifact-name: build-output

  docker:
    name: Docker Build & Push
    needs: [build-test]
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build-push.outputs.image-uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: nuvtools/nuvtools-templates-azure-cicd/.github/actions/azure-login@main
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push
        id: build-push
        uses: nuvtools/nuvtools-templates-azure-cicd/.github/actions/docker-build-push@main
        with:
          registry: ${{ inputs.acr-registry }}
          image-name: ${{ inputs.image-name }}
          image-tag: ${{ needs.build-test.outputs.version }}
          dockerfile: ${{ inputs.dockerfile }}
          artifact-name: build-output
          dotnet-version: ${{ inputs.dotnet-version }}
          entry-point-dll: ${{ inputs.entry-point-dll }}
          push: ${{ inputs.push }}
