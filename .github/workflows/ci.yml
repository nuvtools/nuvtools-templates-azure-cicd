name: CI

# Build, test and publish a .NET project. Tag-driven version/environment
# resolution has been removed: the calling workflow chooses the environment
# explicitly (e.g. a workflow_dispatch dropdown) and passes app-version in.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version (e.g., 10.0.x).'
        type: string
        required: false
        default: '10.0.x'
      project-path:
        description: 'Path to the solution or project file to build. Use the solution when tests live outside the host project.'
        type: string
        required: true
      test-path:
        description: 'Path to the test project. Leave empty to skip tests.'
        type: string
        required: false
        default: ''
      configuration:
        description: 'Build configuration.'
        type: string
        required: false
        default: 'Release'
      publish-artifacts:
        description: 'Whether to publish build artifacts. Enable for artifact-based deployments (zip deploy).'
        type: boolean
        required: false
        default: true
      publish-path:
        description: 'Path to the project to publish. Defaults to project-path. Use a specific .csproj when project-path is a solution to avoid mixed outputs.'
        type: string
        required: false
        default: ''
      app-version:
        description: 'Application version label (used for logs/summary). Defaults to the run number.'
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: 'Resolved version label.'
        value: ${{ jobs.build-test.outputs.version }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version label
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.app-version }}"
          [ -z "$VERSION" ] && VERSION="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        uses: nuvtools/nuvtools-templates-azure-cicd/.github/actions/dotnet-build-test@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-path: ${{ inputs.project-path }}
          test-path: ${{ inputs.test-path }}
          configuration: ${{ inputs.configuration }}
          publish-artifacts: ${{ inputs.publish-artifacts }}
          publish-path: ${{ inputs.publish-path }}
          artifact-name: build-output
