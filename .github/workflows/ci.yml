name: CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version (e.g., 10.0.x).'
        type: string
        required: false
        default: '10.0.x'
      project-path:
        description: 'Path to the solution or project file.'
        type: string
        required: true
      test-path:
        description: 'Path to the test project. Leave empty to skip tests.'
        type: string
        required: false
        default: ''
      configuration:
        description: 'Build configuration.'
        type: string
        required: false
        default: 'Release'
      publish-artifacts:
        description: 'Whether to publish build artifacts. Enable for artifact-based deployments (zip deploy).'
        type: boolean
        required: false
        default: true
      publish-path:
        description: 'Path to the project to publish. Defaults to project-path. Use a specific .csproj when project-path is a solution to avoid mixed outputs.'
        type: string
        required: false
        default: ''
      environment-override:
        description: 'Override the auto-detected environment name (e.g., dev, uat, staging, production).'
        type: string
        required: false
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
    outputs:
      version:
        description: 'Resolved version/image tag.'
        value: ${{ jobs.resolve.outputs.version }}
      environment:
        description: 'Resolved target environment.'
        value: ${{ jobs.resolve.outputs.environment }}
      should-deploy:
        description: 'Whether this build should trigger a deployment.'
        value: ${{ jobs.resolve.outputs.should-deploy }}

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.env-resolve.outputs.environment }}
      is-release: ${{ steps.version.outputs.is-release }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      should-deploy: ${{ steps.version.outputs.should-deploy }}
    steps:
      - name: Resolve version
        id: version
        uses: nuvtools/nuvtools-templates-azure-cicd/.github/actions/resolve-version@v1
        with:
          run-number: ${{ github.run_number }}

      - name: Apply environment override
        id: env-resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.environment-override }}" ]; then
            echo "environment=${{ inputs.environment-override }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ steps.version.outputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        uses: nuvtools/nuvtools-templates-azure-cicd/.github/actions/dotnet-build-test@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          project-path: ${{ inputs.project-path }}
          test-path: ${{ inputs.test-path }}
          configuration: ${{ inputs.configuration }}
          publish-artifacts: ${{ inputs.publish-artifacts }}
          publish-path: ${{ inputs.publish-path }}
          artifact-name: build-output
