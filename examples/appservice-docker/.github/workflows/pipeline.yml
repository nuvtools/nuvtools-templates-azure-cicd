name: Build & Deploy App Service Docker
run-name: Build & Deploy App Service Docker 🚀 ${{ inputs.environment }}

# Example: .NET API deployed to Azure App Service via a Docker container.
# Manual dispatch only — pick the target environment from the dropdown.
# Uses ACR for image storage; production uses a deployment slot with swap.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev
      runDeploy:
        description: 'Deploy after build (uncheck for build + test only)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: nuvtools/nuvtools-templates-azure-cicd/.github/workflows/ci-docker.yml@main
    with:
      dotnet-version: '10.0.x'
      project-path: 'src/MyApp.API/MyApp.API.csproj'
      test-path: 'tests/MyApp.UnitTests/MyApp.UnitTests.csproj'
      acr-registry: myregistry.azurecr.io
      image-name: my-app-api
      entry-point-dll: MyApp.API.dll
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: ci
    if: inputs.runDeploy
    uses: nuvtools/nuvtools-templates-azure-cicd/.github/workflows/cd-appservice.yml@main
    with:
      environment: ${{ inputs.environment }}
      app-version: ${{ needs.ci.outputs.version }}
      deploy-mode: docker
      app-service-name: my-app-${{ inputs.environment }}
      resource-group: rg-${{ inputs.environment }}
      image-uri: ${{ needs.ci.outputs.image-uri }}
      app-settings-file: app-settings-${{ inputs.environment }}.yml
      # Zero-downtime slot swap in production only.
      use-deployment-slot: ${{ inputs.environment == 'production' }}
      slot-name: staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
