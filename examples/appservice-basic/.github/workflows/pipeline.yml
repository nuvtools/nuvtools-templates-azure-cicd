name: Build & Deploy App Service
run-name: Build & Deploy App Service 🚀 ${{ inputs.environment }}

# Basic example: .NET API deployed to Azure App Service via zip deploy.
# Manual dispatch only — pick the target environment from the dropdown.
# The environment name maps to a GitHub Environment, so approval gates and
# environment secrets apply automatically (e.g. require reviewers for production).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev
      runDeploy:
        description: 'Deploy after build (uncheck for build + test only)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: nuvtools/nuvtools-templates-azure-cicd/.github/workflows/ci.yml@main
    with:
      dotnet-version: '10.0.x'
      project-path: 'src/MyApp.API/MyApp.API.csproj'
      test-path: 'tests/MyApp.UnitTests/MyApp.UnitTests.csproj'

  deploy:
    needs: ci
    if: inputs.runDeploy
    uses: nuvtools/nuvtools-templates-azure-cicd/.github/workflows/cd-appservice.yml@main
    with:
      environment: ${{ inputs.environment }}
      app-version: ${{ needs.ci.outputs.version }}
      deploy-mode: artifact
      app-service-name: my-app-${{ inputs.environment }}
      resource-group: rg-${{ inputs.environment }}
      app-settings-file: app-settings-${{ inputs.environment }}.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
