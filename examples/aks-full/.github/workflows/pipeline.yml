name: Build & Deploy AKS
run-name: Build & Deploy AKS 🚀 ${{ inputs.environment }}

# Full example: .NET API deployed to AKS via Helm.
# Manual dispatch only — pick the target environment from the dropdown.
# Per-environment Helm values live in the application repo.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev
      runDeploy:
        description: 'Deploy after build (uncheck for build + test only)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: nuvtools/nuvtools-templates-azure-cicd/.github/workflows/ci-docker.yml@main
    with:
      dotnet-version: '10.0.x'
      project-path: 'src/MyApp.API/MyApp.API.csproj'
      test-path: 'tests/MyApp.UnitTests/MyApp.UnitTests.csproj'
      acr-registry: myregistry.azurecr.io
      image-name: my-app-api
      entry-point-dll: MyApp.API.dll
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: ci
    if: inputs.runDeploy
    uses: nuvtools/nuvtools-templates-azure-cicd/.github/workflows/cd-aks.yml@main
    with:
      environment: ${{ inputs.environment }}
      image-uri: ${{ needs.ci.outputs.image-uri }}
      app-version: ${{ needs.ci.outputs.version }}
      aks-cluster-name: my-aks-${{ inputs.environment }}
      aks-resource-group: rg-${{ inputs.environment }}
      namespace: my-app
      release-name: my-app-api
      values-file: helm-values-${{ inputs.environment }}.yml
      env-values-file: env-values-${{ inputs.environment }}.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
